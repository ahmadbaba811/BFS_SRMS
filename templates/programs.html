{% extends "base.html" %}
{% block title %}Programs{% endblock %}
{% block content %}
<h1 class="mb-4">Mentorship programs</h1>
<div class="card shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Program</th>
                        <th>Starts</th>
                        <th>Ends</th>
                    </tr>
                </thead>
                <tbody>
                    {% for program in programs %}<tr>
                        <td>{{ program[0] }}</td>
                        <td>{{ program[1] }}</td>
                        <td>{{ program[2] }}</td>
                    </tr>{% else %}<tr>
                        <td colspan="3" class="text-muted">No programs available.</td>
                    </tr>{% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
